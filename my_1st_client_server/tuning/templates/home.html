<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тюнинг автомобилей</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        .header {
            background-color: #333;
            color: white;
            padding: 10px 0;
            text-align: center;
        }

        .login-link {
            position: absolute;
            right: 20px;
            top: 10px;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #333;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="login-link">
            <a href="{% url 'login' %}" style="color: white; text-decoration: none;">
                <i class="fa fa-user">Войти</i>
            </a>
        </div>
        <h1>Центр тюнинга автомобилей</h1>
    </div>

    <div class="container">
        <h2>Загрузка данных автомобиля</h2>
        <form>
            <div class="form-group">
                <label for="vin">VIN-номер:</label>
                <input type="text" id="vin" required>
            </div>
            <div class="form-group">
                <label for="basePrice">Базовая цена:</label>
                <input type="number" id="basePrice" required>
            </div>
            <div class="form-group">
                <label for="description">Описание:</label>
                <textarea id="description" rows="3"></textarea>
            </div>

            <!-- Опции тюнинга -->
            <h3>Выберите опции тюнинга:</h3>
            <div class="form-group">
                <input type="checkbox" id="engine" name="tuningOptions">
                <label for="engine">Улучшение двигателя (+50%)</label><br>

                <input type="checkbox" id="nitrous" name="tuningOptions">
                <label for="nitrous">Закись азота (+100000)</label><br>

                <input type="checkbox" id="turbine" name="tuningOptions">
                <label for="turbine">Турбо (+50000)</label><br>

                <input type="checkbox" id="sound" name="tuningOptions">
                <label for="sound">Звуковая система (+20%)</label>
            </div>

            <button type="submit">Отправить</button>
        </form>
    </div>
</body>
</html>
